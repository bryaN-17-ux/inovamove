<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InovaMove - Mapa</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/mapa.css">
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-icon">🚌</div>
  <div class="header-text">
    <h1>InovaMove</h1>
    <p>Mobilidade Acessível</p>
  </div>
</header>

<!-- MAIN -->
<div class="main">

  <!-- MAP -->
  <div class="map-container">
    <div class="map-badge">
      <strong id="badge-count">Carregando...</strong>
      <span id="badge-sub">buscando linhas</span>
    </div>

    <div class="loading-overlay" id="loading">
      <div class="spinner"></div>
      <p>Carregando linhas do Transcol...</p>
    </div>

    <div id="map"></div>
  </div>

  <!-- BOTTOM PANEL -->
  <div class="bottom-panel">
    <div class="panel-header">
      <h2>Linhas próximas</h2>
      <span class="count" id="lines-count">—</span>
    </div>

    <div class="filter-tabs">
      <button class="tab active" onclick="filtrarLinhas('todos')">Todas</button>
      <button class="tab" onclick="filtrarLinhas('transcol')">Transcol</button>
      <button class="tab" onclick="filtrarLinhas('municipal')">Municipal</button>
      <button class="tab" onclick="filtrarLinhas('acessivel')">♿ Acessível</button>
    </div>

    <div class="lines-list" id="lines-list">
      <div class="empty-state">
        <div class="emoji">🗺️</div>
        <p>Carregando linhas...</p>
      </div>
    </div>
  </div>
</div>
